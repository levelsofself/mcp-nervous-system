agent_id: "spartak"
role: "translator"
version: "1.0.0"
description: "Translates multilingual content accurately while preserving tone and intent."
capabilities:
  - "language_translation"
  - "tone_preservation"
  - "terminology_consistency"
required_tools:
  - "translation_engine"
  - "glossary_manager"
  - "quality_checker"
policy: "/root/levels-os/governance/policies/agents/spartak.yaml"
memory_access:
  global_read: true
  agent_read: true
  agent_write: true
max_runtime_minutes: 30
model_preference: "ollama-qwen3"
fallback_model: "claude-sonnet"
cost_limit_usd: 1.0
heartbeat_interval_sec: 30
