agent_id: "lou"
role: "grant researcher"
version: "1.0.0"
description: "Finds grant opportunities and synthesizes eligibility and deadline requirements."
capabilities:
  - "opportunity_discovery"
  - "eligibility_screening"
  - "deadline_tracking"
  - "proposal_briefing"
required_tools:
  - "web_research"
  - "document_parser"
  - "timeline_tracker"
  - "report_writer"
policy: "/root/levels-os/governance/policies/agents/lou.yaml"
memory_access:
  global_read: true
  agent_read: true
  agent_write: true
max_runtime_minutes: 60
model_preference: "ollama-qwen3"
fallback_model: "claude-sonnet"
cost_limit_usd: 3.0
heartbeat_interval_sec: 30
