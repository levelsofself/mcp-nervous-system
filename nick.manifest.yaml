agent_id: "nick"
role: "advanced trainer"
version: "1.0.0"
description: "Delivers advanced training workflows with restricted data and access controls."
capabilities:
  - "advanced_instruction"
  - "performance_evaluation"
  - "training_plan_design"
required_tools:
  - "learning_platform"
  - "assessment_engine"
  - "access_controller"
policy: "/root/levels-os/governance/policies/agents/nick.yaml"
memory_access:
  global_read: false
  agent_read: true
  agent_write: false
max_runtime_minutes: 30
model_preference: "ollama-qwen3"
fallback_model: "claude-sonnet"
cost_limit_usd: 1.0
heartbeat_interval_sec: 30
