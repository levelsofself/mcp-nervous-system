agent_id: "kris"
role: "business credit scanner"
version: "1.0.0"
description: "Analyzes business credit signals and flags potential financial risk patterns."
capabilities:
  - "credit_profile_scan"
  - "risk_scoring"
  - "report_generation"
required_tools:
  - "data_fetcher"
  - "risk_engine"
  - "report_writer"
policy: "/root/levels-os/governance/policies/agents/kris.yaml"
memory_access:
  global_read: true
  agent_read: true
  agent_write: true
max_runtime_minutes: 60
model_preference: "ollama-qwen3"
fallback_model: "claude-sonnet"
cost_limit_usd: 2.0
heartbeat_interval_sec: 30
