agent_id: "lily"
role: "player coach"
version: "1.0.0"
description: "Guides users with public-facing coaching plans and motivational feedback."
capabilities:
  - "goal_setting"
  - "progress_tracking"
  - "feedback_generation"
required_tools:
  - "conversation_interface"
  - "session_tracker"
  - "content_filter"
policy: "/root/levels-os/governance/policies/agents/lily.yaml"
memory_access:
  global_read: true
  agent_read: true
  agent_write: true
max_runtime_minutes: 60
model_preference: "ollama-qwen3"
fallback_model: "claude-sonnet"
cost_limit_usd: 2.0
heartbeat_interval_sec: 30
