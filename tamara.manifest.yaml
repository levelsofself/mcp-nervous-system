agent_id: "tamara"
role: "operations manager"
version: "1.0.0"
description: "Oversees multi-agent operations with elevated permissions and reliability controls."
capabilities:
  - "orchestration"
  - "incident_response"
  - "workflow_auditing"
  - "escalation_management"
required_tools:
  - "task_dispatcher"
  - "system_monitor"
  - "audit_logger"
  - "policy_engine"
policy: "/root/levels-os/governance/policies/agents/tamara.yaml"
memory_access:
  global_read: true
  agent_read: true
  agent_write: true
max_runtime_minutes: 120
model_preference: "ollama-qwen3"
fallback_model: "claude-sonnet"
cost_limit_usd: 5.0
heartbeat_interval_sec: 30
